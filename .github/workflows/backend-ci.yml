name: QueueFlow Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Spring Boot Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: queueflow_test
          POSTGRES_USER: queueflow_app
          POSTGRES_PASSWORD: queueflow_ci_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U queueflow_app -d queueflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: api

    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5433/queueflow_test
      TEST_DB_USERNAME: queueflow_app
      TEST_DB_PASSWORD: queueflow_ci_test_password
      DB_URL: jdbc:postgresql://localhost:5433/queueflow_test
      DB_USERNAME: queueflow_app
      DB_PASSWORD: queueflow_ci_test_password
      SPRING_PROFILES_ACTIVE: test
      WEB_ORIGIN: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Generate temporary encryption keys
        run: |
          echo "GUEST_TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "QR_CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Run Spring Boot tests
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-test-reports
          path: api/target/surefire-reports/
          retention-days: 7

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Spring Boot Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          tags: queueflow-api:ci

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_DB: queueflow_test
          POSTGRES_USER: queueflow_app
          POSTGRES_PASSWORD: queueflow_ci_test_password
          GUEST_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          QR_CREDENTIAL_ENCRYPTION_KEY: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
        run: docker compose config --quiet
